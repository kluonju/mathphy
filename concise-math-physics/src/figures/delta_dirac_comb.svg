<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Dirac comb schematic">
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#222">Dirac comb &#x2211;<tspan baseline-shift="sub" font-size="11">n</tspan> &#x03B4;(x &#x2212; nP)</text>
  <line x1="40" y1="220" x2="520" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="220" x2="40" y2="50" stroke="#333" stroke-width="1.5"/>
  <!-- spikes -->
  <g stroke="#4C78A8" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="220" x2="100" y2="70"/>
    <line x1="180" y1="220" x2="180" y2="70"/>
    <line x1="260" y1="220" x2="260" y2="70"/>
    <line x1="340" y1="220" x2="340" y2="70"/>
    <line x1="420" y1="220" x2="420" y2="70"/>
  </g>
  <g fill="#4C78A8">
    <polygon points="100,70 94,84 106,84"/>
    <polygon points="180,70 174,84 186,84"/>
    <polygon points="260,70 254,84 266,84"/>
    <polygon points="340,70 334,84 346,84"/>
    <polygon points="420,70 414,84 426,84"/>
  </g>
  <text x="88" y="245" font-family="serif" font-size="13" fill="#333">&#x2212;2P</text>
  <text x="168" y="245" font-family="serif" font-size="13" fill="#333">&#x2212;P</text>
  <text x="255" y="245" font-family="serif" font-size="13" fill="#333">0</text>
  <text x="332" y="245" font-family="serif" font-size="13" fill="#333">P</text>
  <text x="408" y="245" font-family="serif" font-size="13" fill="#333">2P</text>
  <text x="480" y="235" font-family="serif" font-size="14" fill="#333">x</text>
  <text x="48" y="60" font-family="serif" font-size="14" fill="#333">&#x03B4;</text>
  <text x="80" y="280" font-family="serif" font-size="13" fill="#555">FT of a comb is another comb (period &#x2194; spacing)</text>
</svg>
